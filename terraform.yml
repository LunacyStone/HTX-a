name: Terraform CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
  push:
    branches: [main]
    paths:
      - 'terraform/**'

permissions:
  id-token: write   # required to request the OIDC token
  contents: read
  pull-requests: write  # required to post the plan as a PR comment

env:
  AWS_REGION: ap-southeast-1
  TF_WORKING_DIR: terraform

jobs:

  # ---------------------------------------------------------
  # Stage 1: Lint / static analysis with Checkov
  # Runs first, before any plan is generated, on both PR and push.
  # ---------------------------------------------------------
  checkov:
    name: Checkov Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ${{ env.TF_WORKING_DIR }}
          framework: terraform
          output_format: cli
          soft_fail: false   # fail the pipeline if Checkov finds a high-severity issue

  # ---------------------------------------------------------
  # Stage 2: Automated Drift/Risk Detection (Task 6)
  # Runs after Checkov, before the OFFICIAL plan stage below.
  # Generates its own throwaway plan purely to feed detector.py
  # live terraform plan JSON — this is separate from the plan
  # generated in the "plan" job, which is the one saved/posted
  # for human review. Terraform effectively runs twice across
  # the pipeline (once here, once officially) as a deliberate
  # trade-off: it keeps the detector's gating role cleanly
  # separated from the human-review artifact, and lets this
  # stage fail fast — before spending time producing and
  # posting the official plan — if a high-risk change is found.
  # ---------------------------------------------------------
  drift-detector:
    name: Automated Risk Detection
    needs: checkov
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::611723957143:role/github-actions-terraform-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Terraform Init
        run: terraform init

      - name: Generate throwaway plan for analysis only
        run: terraform plan -out=detector.tfplan -no-color

      - name: Convert plan to JSON and run risk detector
        run: terraform show -json detector.tfplan | python3 ../drift-detector/detector.py --output detector-report.json

      - name: Upload risk report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-detector-report
          path: ${{ env.TF_WORKING_DIR }}/detector-report.json
          retention-days: 5

  # ---------------------------------------------------------
  # Stage 3: Terraform Plan
  # Runs only on pull_request, after Checkov AND the drift
  # detector both pass (i.e. no high-risk change was found).
  # Saves the plan as an artifact so the exact reviewed plan
  # can be applied later, with no re-computation (no drift).
  # ---------------------------------------------------------
  plan:
    name: Terraform Plan
    needs: [checkov, drift-detector]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::611723957143:role/github-actions-terraform-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: plan
        run: terraform plan -out=tfplan -no-color
        continue-on-error: true

      - name: Save readable plan output
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Upload plan artifact (binary, used for apply)
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 5

      - name: Upload readable plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-readable
          path: ${{ env.TF_WORKING_DIR }}/tfplan.txt
          retention-days: 5

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.TF_WORKING_DIR }}/tfplan.txt', 'utf8').slice(0, 60000);
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### Terraform Plan Output\n\`\`\`\n${plan}\n\`\`\``
            });

      - name: Fail if plan step failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ---------------------------------------------------------
  # Stage 4: Gated Apply
  # Runs only on push to main (i.e. after PR merge), and only
  # after the drift detector has passed on this push event too.
  # Uses a GitHub Environment with required reviewers to
  # enforce manual approval before this job proceeds.
  # NOTE: this re-generates a plan (since the PR's saved plan
  # artifact does not carry over to a separate push event) and
  # applies it in the same job run, immediately after approval,
  # to minimise the drift window between plan and apply.
  # ---------------------------------------------------------
  apply:
    name: Terraform Apply (Gated)
    needs: [checkov, drift-detector]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production   # <-- configure this environment with required reviewers in repo settings
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::611723957143:role/github-actions-terraform-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan -no-color

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
